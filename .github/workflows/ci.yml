name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - run: SKIP=clang-tidy pre-commit run --all-files --show-diff-on-failure

  build:
    name: Build, tidy & test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - run: pip install pre-commit

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Tidy
        run: pre-commit run clang-tidy --all-files

      - name: Test
        env:
          # No display on the runner: Qt renders off-screen.
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml

      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results.xml
          check_name: Test results
          annotate_only: true
          include_passed: true
          detailed_summary: true

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMANGROVE_BUILD_TESTS=OFF -DMANGROVE_DEPLOY_QT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        working-directory: build
        run: cpack -G TGZ

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/Mangrove-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build & package (Windows, MSVC)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - uses: microsoft/setup-msbuild@v1.0.2

      - name: Configure
        run: cmake -S . -B build -DMANGROVE_DEPLOY_QT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        working-directory: build
        run: cpack -G NSIS -C Release

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: build/Mangrove-*-win64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload CPack logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cpack-logs-windows
          path: build/_CPack_Packages/**/*.log
          if-no-files-found: ignore

